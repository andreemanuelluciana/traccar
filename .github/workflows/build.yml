name: Maven Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-java@v2
      with:
        java-version: '11'
    - run: mvn clean install
    - run: mvn test
    - uses: actions/upload-artifact@v2
      with:
        name: traccar-build
        path: target/*.jar
